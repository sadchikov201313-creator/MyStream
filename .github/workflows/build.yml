name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Unzip project
        run: unzip -q MyStream-V2.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        working-directory: MyStream
        run: gradle assembleDebug --console=plain
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp MyStream/app/build/outputs/apk/debug/app-debug.apk MyStream.apk
          gh release create "v${{ github.run_number }}" MyStream.apk --repo ${{ github.repository }} --title "MyStream v${{ github.run_number }}" --notes "Автосборка"
