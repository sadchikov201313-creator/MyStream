name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Unzip project
        run: unzip -q MyStream.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        working-directory: MyStream
        run: gradle assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: MyStream-apk
          path: MyStream/app/build/outputs/apk/debug/app-debug.apk
